name: Update AUR package

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC
  workflow_dispatch:        # manual trigger from the Actions tab

concurrency:
  group: update-aur
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install tooling
        run: |
          pacman -Syu --noconfirm --needed \
            git openssh nvchecker jq pacman-contrib

      - uses: actions/checkout@v5

      - name: Trust workspace (git safe.directory)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check upstream version with nvchecker
        id: nv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '[keys]\ngithub = "%s"\n' "$GITHUB_TOKEN" > keyfile.toml
          # --failures: exit non-zero if any source check errors, so a network/API
          # failure can never produce an empty new.json that fakes a downgrade.
          nvchecker -c nvchecker.toml --keyfile keyfile.toml --failures
          # Handle both nvchecker v2 (.data.<name>.version) and legacy flat format.
          new=$(jq -r '.data."omp-bin".version // ."omp-bin" // empty' new.json)
          cur=$(grep -Po '^pkgver=\K.*' PKGBUILD)
          echo "Current: $cur | Upstream: $new"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ -n "$new" ] && [ "$new" != "null" ] && [ "$new" != "$cur" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump PKGBUILD + regenerate .SRCINFO
        if: steps.nv.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # makepkg refuses to run as root
          useradd -m builder
          chown -R builder:builder .
          su builder -c "GITHUB_TOKEN='$GITHUB_TOKEN' scripts/update.sh '${{ steps.nv.outputs.new }}'"

      - name: Build-test the package (clean, no install)
        if: steps.nv.outputs.changed == 'true'
        run: |
          su builder -c "makepkg --syncdeps --noconfirm --noarchive --cleanbuild"

      - name: Publish to AUR
        if: steps.nv.outputs.changed == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: omp-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "upgpkg: omp-bin ${{ steps.nv.outputs.new }}"
          updpkgsums: false
          test: false

      - name: Accept new version into nvchecker state + commit back
        if: steps.nv.outputs.changed == 'true'
        run: |
          nvtake -c nvchecker.toml omp-bin
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO old.json
          git commit -m "upgpkg: omp-bin ${{ steps.nv.outputs.new }}" || echo "nothing to commit"
          git push
